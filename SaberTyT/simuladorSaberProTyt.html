<script>
(function(){
  const root = document.getElementById('root');

  const state = {
    screen:'setup',
    modo:'estudio',        // 'estudio' | 'simulacro' | 'concepto'
    modulos:['formar','evaluar','ensenar'],
    cantidad:'todas',      // 'todas' | '10' | '20'
    preguntas:[],          // array armado para la sesión
    idx:0,
    respuestas:[],         // {pregunta, elegida, correcta}
    seleccionActual:null,
    revelado:false,
    tiempoRestante:0,
    timerId:null,
    guiaStep:0,             // paso activo del slider "cómo leer una pregunta"
    conceptoTab:'guia',     // 'guia' | 'formar' | 'evaluar' | 'ensenar'
    reporteNombre:'',
    reporteDocumento:'',
    ejemplosAbiertos:{}     // {'formar-fis': true, ...} control de acordeones
  };

  function shuffle(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
  }

  function armarPreguntas(){
    let pool=[];
    state.modulos.forEach(m=>{
      MODULOS[m].preguntas.forEach(p=>pool.push(Object.assign({modulo:m}, p)));
    });
    pool = shuffle(pool);
    if(state.cantidad!=='todas'){
      pool = pool.slice(0, parseInt(state.cantidad,10));
    }
    return pool;
  }

  function segundosPorPregunta(){ return 75; } // ~75s por ítem en simulacro

  function startSesion(){
    if(state.modo==='concepto'){
      state.screen='concepto';
      render();
      return;
    }
    state.preguntas = armarPreguntas();
    state.idx=0;
    state.respuestas=[];
    state.seleccionActual=null;
    state.revelado=false;
    state.screen='quiz';
    if(state.modo==='simulacro'){
      state.tiempoRestante = state.preguntas.length * segundosPorPregunta();
      startTimer();
    }
    render();
  }

  function startTimer(){
    clearInterval(state.timerId);
    state.timerId = setInterval(()=>{
      state.tiempoRestante--;
      if(state.tiempoRestante<=0){
        clearInterval(state.timerId);
        finalizarSesion();
        return;
      }
      const el = document.getElementById('timerDisplay');
      if(el){
        el.textContent = fmtTime(state.tiempoRestante);
        el.className = 'timer' + (state.tiempoRestante<60?' low':'');
      }
    },1000);
  }

  function fmtTime(s){
    const m=Math.floor(s/60), sec=s%60;
    return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
  }

  function elegirOpcion(letra){
    if(state.modo==='estudio' && state.revelado) return;
    state.seleccionActual = letra;
    if(state.modo==='estudio'){
      state.revelado = true;
    }
    render();
  }

  function siguiente(){
    const p = state.preguntas[state.idx];
    state.respuestas.push({
      modulo:p.modulo, n:p.n, comp:p.comp,
      elegida:state.seleccionActual, correcta:p.correcta,
      acierto: state.seleccionActual===p.correcta
    });
    state.idx++;
    state.seleccionActual=null;
    state.revelado=false;
    if(state.idx>=state.preguntas.length){
      finalizarSesion();
    } else {
      render();
    }
  }

  function finalizarSesion(){
    clearInterval(state.timerId);
    // si quedó una pregunta sin responder (por timeout) la registramos como fallada
    if(state.respuestas.length < state.preguntas.length){
      for(let i=state.respuestas.length;i<state.preguntas.length;i++){
        const p = state.preguntas[i];
        state.respuestas.push({modulo:p.modulo, n:p.n, comp:p.comp, elegida:null, correcta:p.correcta, acierto:false});
      }
    }
    state.screen='resultados';
    render();
  }

  function volverInicio(){
    clearInterval(state.timerId);
    state.screen='setup';
    render();
  }

  // ---------- RENDER ----------

  function render(){
    root.innerHTML='';
    root.appendChild(masthead());
    if(state.screen==='setup') root.appendChild(viewSetup());
    if(state.screen==='quiz') root.appendChild(viewQuiz());
    if(state.screen==='resultados') root.appendChild(viewResultados());
    if(state.screen==='concepto') root.appendChild(viewConceptos());
  }

  function el(tag, cls, html){
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(html!==undefined) e.innerHTML=html;
    return e;
  }

  function masthead(){
    const wrap = el('div','masthead');
    const left = el('div');
    left.appendChild(el('div','eyebrow','Práctica pedagógica para Normalistas Superiores'));
    left.appendChild(el('h1',null,'Simulador Saber Pro / TyT'));
    left.appendChild(el('div','sub','Módulos de la práctica pedagógica · Formar — Evaluar — Enseñar'));
    wrap.appendChild(left);
    wrap.appendChild(el('div','badge-seal','73 ítems oficiales Icfes'));
    return wrap;
  }

  function viewSetup(){
    const wrap = el('div');

    // modo
    const card1 = el('div','card');
    card1.appendChild(el('span','field-label','1 · Modo de entrenamiento'));
    const grid1 = el('div','choice-grid');
    const optEstudio = el('div','choice'+(state.modo==='estudio'?' selected':''),
      '<h4>Modo estudio</h4><p>Responde y recibe retroalimentación inmediata: por qué la opción es correcta y por qué las demás no lo son.</p>');
    optEstudio.onclick=()=>{state.modo='estudio'; render();};
    const optSimulacro = el('div','choice'+(state.modo==='simulacro'?' selected':''),
      '<h4>Modo simulacro</h4><p>Presión de examen real: tiempo cronometrado, sin pistas. La retroalimentación llega al final, por competencia.</p>');
    optSimulacro.onclick=()=>{state.modo='simulacro'; render();};
    const optConcepto = el('div','choice'+(state.modo==='concepto'?' selected':''),
      '<h4>Modo conceptualización</h4><p>Antes de practicar: qué evalúa cada módulo y cada competencia, explicado en simple, con las trampas más comunes.</p>');
    optConcepto.onclick=()=>{state.modo='concepto'; render();};
    grid1.appendChild(optConcepto); grid1.appendChild(optEstudio); grid1.appendChild(optSimulacro);
    card1.appendChild(grid1);
    wrap.appendChild(card1);

    // modulos (no aplica en modo conceptualización: allí se navega por pestañas)
    if(state.modo!=='concepto'){
      const card2 = el('div','card');
      card2.appendChild(el('span','field-label','2 · Módulos a entrenar'));
      const grid2 = el('div','choice-grid');
      ['formar','evaluar','ensenar'].forEach(m=>{
        const active = state.modulos.includes(m);
        const c = el('div','choice'+(active?' selected':''),
          '<h4>'+MODULOS[m].titulo+'</h4><p>'+MODULOS[m].subtitulo+' · '+MODULOS[m].preguntas.length+' preguntas</p>');
        c.onclick=()=>{
          if(active){
            if(state.modulos.length>1) state.modulos = state.modulos.filter(x=>x!==m);
          } else {
            state.modulos = state.modulos.concat([m]);
          }
          render();
        };
        grid2.appendChild(c);
      });
      card2.appendChild(grid2);
      wrap.appendChild(card2);
    }

    // cantidad (no aplica en modo conceptualización)
    if(state.modo!=='concepto'){
      const card3 = el('div','card');
      card3.appendChild(el('span','field-label','3 · Cantidad de preguntas'));
      const totalDisp = state.modulos.reduce((s,m)=>s+MODULOS[m].preguntas.length,0);
      const grid3 = el('div','choice-grid');
      [['todas','Todas las disponibles','('+totalDisp+' preguntas)'],
       ['10','Ronda corta','10 preguntas aleatorias'],
       ['20','Ronda media','20 preguntas aleatorias']].forEach(([val,title,desc])=>{
        const c = el('div','choice'+(state.cantidad===val?' selected':''),'<h4>'+title+'</h4><p>'+desc+'</p>');
        c.onclick=()=>{state.cantidad=val; render();};
        grid3.appendChild(c);
      });
      card3.appendChild(grid3);
      wrap.appendChild(card3);
    }

    const btnRow = el('div','btn-row');
    const startBtn = el('button','btn magenta', state.modo==='concepto' ? 'Ver conceptos →' : 'Comenzar →');
    startBtn.onclick=startSesion;
    btnRow.appendChild(startBtn);
    wrap.appendChild(btnRow);

    return wrap;
  }

  function viewQuiz(){
    const wrap = el('div');
    const p = state.preguntas[state.idx];
    const pct = Math.round((state.idx/state.preguntas.length)*100);

    const bar = el('div','quizbar');
    bar.appendChild(el('span',null,'PREGUNTA '+(state.idx+1)+' / '+state.preguntas.length+' · '+MODULOS[p.modulo].titulo.toUpperCase()));
    wrap.appendChild(bar);

    if(state.modo==='simulacro'){
      const t = el('span','timer'+(state.tiempoRestante<60?' low':''), fmtTime(state.tiempoRestante));
      t.id='timerDisplay';
      bar.appendChild(t);
    }

    const track = el('div','progress-track');
    const fill = el('div','progress-fill'); fill.style.width=pct+'%';
    track.appendChild(fill);
    wrap.appendChild(track);

    const meta = el('div','qmeta');
    meta.appendChild(el('span','tag comp', COMPETENCIAS[p.modulo][p.comp]));
    if(p.dif) meta.appendChild(el('span','tag dif-'+p.dif, 'Dificultad '+p.dif));
    wrap.appendChild(meta);

    wrap.appendChild(el('div','enunciado', p.enun));

    const opsWrap = el('div','opciones');
    ['A','B','C','D'].forEach(letra=>{
      const isSel = state.seleccionActual===letra;
      let cls='op';
      if(state.modo==='estudio' && state.revelado){
        cls+=' disabled';
        if(letra===p.correcta) cls+=' correct';
        else if(isSel) cls+=' wrong';
      } else if(isSel){
        cls+=' selected';
      }
      const op = el('div',cls,
        '<span class="letra">'+letra+'</span><p>'+p.ops[letra]+'</p>');
      if(!(state.modo==='estudio' && state.revelado)){
        op.onclick=()=>elegirOpcion(letra);
      }
      opsWrap.appendChild(op);
    });
    wrap.appendChild(opsWrap);

    if(state.modo==='estudio' && state.revelado){
      const ok = state.seleccionActual===p.correcta;
      const fb = el('div','feedback');
      const head = el('div','feedback-head '+(ok?'ok':'no'), ok?'✓ Respuesta correcta':'✕ Respuesta incorrecta — la correcta es '+p.correcta);
      fb.appendChild(head);
      const body = el('div','feedback-body');
      if(p.expl){
        body.appendChild(el('div','why','<b>Por qué '+p.correcta+' es correcta:</b> '+p.expl.correcta));
        Object.keys(p.expl.invalidas).forEach(letra=>{
          body.appendChild(el('div','invalid-item','<b>Opción '+letra+':</b> '+p.expl.invalidas[letra]));
        });
      } else {
        body.appendChild(el('div','no-explic','Esta pregunta no cuenta con justificación detallada por opción en el material fuente. Competencia evaluada: '+COMPETENCIAS[p.modulo][p.comp]+'.'));
      }
      fb.appendChild(body);
      wrap.appendChild(fb);
    }

    const btnRow = el('div','btn-row');
    const nextBtn = el('button','btn magenta', state.idx===state.preguntas.length-1?'Ver resultados →':'Siguiente →');
    const canAdvance = state.modo==='simulacro' ? state.seleccionActual!==null : state.revelado;
    nextBtn.disabled = !canAdvance;
    nextBtn.onclick=siguiente;
    btnRow.appendChild(nextBtn);
    const exitBtn = el('button','btn secondary','Salir');
    exitBtn.onclick=volverInicio;
    btnRow.appendChild(exitBtn);
    wrap.appendChild(btnRow);

    return wrap;
  }

  function sugerenciaPara(p){
    if(p>=0.85) return "Dominio sólido. Mantén el ritmo con simulacros completos espaciados en el tiempo.";
    if(p>=0.6) return "Nivel aceptable, con espacio de mejora. Repasa el ejemplo típico de esta competencia en modo conceptualización y repite un bloque corto de preguntas.";
    return "Nivel bajo. Vuelve al modo conceptualización para esta competencia, estudia con calma el ejemplo típico y las opciones descartadas, y practica un bloque dirigido antes del próximo simulacro.";
  }

  function generarReportePDF(){
    if(!window.jspdf){
      alert('No se pudo cargar la librería para generar el PDF. Verifica tu conexión a internet e inténtalo de nuevo.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const marginX = 48;
    let y = 56;

    const total = state.respuestas.length;
    const aciertos = state.respuestas.filter(r=>r.acierto).length;
    const pct = total ? Math.round((aciertos/total)*100) : 0;

    function checkPage(needed){
      if(y+needed > pageHeight-50){ doc.addPage(); y=56; }
    }

    // Encabezado
    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(59,42,30);
    doc.text('Reporte de desempeño', marginX, y);
    y += 18;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(109,90,69);
    doc.text('Simulador Saber Pro / TyT — módulos Formar, Evaluar y Enseñar', marginX, y);
    y += 22;
    doc.setDrawColor(220,196,160);
    doc.line(marginX, y, pageWidth-marginX, y);
    y += 22;

    // Datos del estudiante
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(59,42,30);
    doc.text('Datos del estudiante', marginX, y); y+=16;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text('Nombre: ' + (state.reporteNombre.trim() || 'No registrado'), marginX, y); y+=14;
    doc.text('Documento de identidad: ' + (state.reporteDocumento.trim() || 'No registrado'), marginX, y); y+=14;
    const fecha = new Date().toLocaleDateString('es-CO', {year:'numeric', month:'long', day:'numeric'});
    doc.text('Fecha del reporte: ' + fecha, marginX, y); y+=14;
    doc.text('Modo de la sesión: ' + (state.modo==='simulacro' ? 'Simulacro (cronometrado, sin retroalimentación en línea)' : 'Estudio (con retroalimentación inmediata)'), marginX, y); y+=22;

    // Resultado general
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('Resultado general', marginX, y); y+=16;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text('Preguntas respondidas: ' + total, marginX, y); y+=14;
    doc.text('Aciertos: ' + aciertos + ' de ' + total + ' (' + pct + '%)', marginX, y); y+=22;

    // Desempeño por competencia
    const grouped = {};
    state.respuestas.forEach(r=>{
      const key = r.modulo+'|'+r.comp;
      if(!grouped[key]) grouped[key]={ok:0,total:0, modulo:r.modulo, comp:r.comp};
      grouped[key].total++;
      if(r.acierto) grouped[key].ok++;
    });
    const filas = Object.values(grouped).sort((a,b)=>(a.ok/a.total)-(b.ok/b.total));

    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(59,42,30);
    doc.text('Desempeño por competencia', marginX, y); y+=8;

    if(typeof doc.autoTable === 'function'){
      const body = filas.map(f=>{
        const p = Math.round((f.ok/f.total)*100);
        return [MODULOS[f.modulo].titulo, COMPETENCIAS[f.modulo][f.comp], f.ok+'/'+f.total, p+'%'];
      });
      doc.autoTable({
        startY: y+8,
        margin:{left:marginX, right:marginX},
        head:[['Módulo','Competencia','Aciertos','%']],
        body: body,
        styles:{font:'helvetica', fontSize:9, cellPadding:6, textColor:[59,42,30]},
        headStyles:{fillColor:[181,73,42], textColor:255},
        alternateRowStyles:{fillColor:[251,241,225]},
        columnStyles:{0:{cellWidth:70}, 1:{cellWidth:300}, 2:{cellWidth:55}, 3:{cellWidth:40}}
      });
      y = doc.lastAutoTable.finalY + 20;
    } else {
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      filas.forEach(f=>{
        checkPage(24);
        const p = Math.round((f.ok/f.total)*100);
        const linea = MODULOS[f.modulo].titulo+' — '+COMPETENCIAS[f.modulo][f.comp]+': '+f.ok+'/'+f.total+' ('+p+'%)';
        const split = doc.splitTextToSize(linea, pageWidth-2*marginX);
        doc.text(split, marginX, y);
        y += split.length*12 + 6;
      });
      y += 10;
    }

    // Preguntas para repasar
    const falladas = state.respuestas.filter(r=>!r.acierto);
    checkPage(60);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(59,42,30);
    doc.text('Preguntas para repasar ('+falladas.length+')', marginX, y); y+=16;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(109,90,69);
    if(falladas.length===0){
      doc.text('Ninguna — el estudiante respondió correctamente todas las preguntas de la sesión.', marginX, y); y+=16;
    } else {
      const lista = falladas.map(f=>MODULOS[f.modulo].titulo+' #'+f.n).join('   ·   ');
      const split = doc.splitTextToSize(lista, pageWidth-2*marginX);
      doc.text(split, marginX, y); y += split.length*12+14;
    }

    // Sugerencias de refuerzo
    checkPage(80);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(59,42,30);
    doc.text('Sugerencias de refuerzo', marginX, y); y+=16;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(109,90,69);
    filas.forEach(f=>{
      checkPage(40);
      const p = f.ok/f.total;
      const texto = MODULOS[f.modulo].titulo+' · '+COMPETENCIAS[f.modulo][f.comp]+' — '+sugerenciaPara(p);
      const split = doc.splitTextToSize(texto, pageWidth-2*marginX);
      doc.text(split, marginX, y);
      y += split.length*12 + 8;
    });

    // Pie de página
    checkPage(34);
    doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(140,125,105);
    doc.text('Generado automáticamente por el Simulador Saber Pro/TyT, con base en cuadernillos oficiales Icfes, con fines exclusivamente académicos.', marginX, y, {maxWidth: pageWidth-2*marginX});

    const base = state.reporteNombre.trim() || state.reporteDocumento.trim() || 'estudiante';
    const nombreArchivo = 'reporte_' + base.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    doc.save(nombreArchivo + '.pdf');
  }

  function renderEjemploFocus(focus){
    const E = EJEMPLO_GUIA;
    const box = document.createElement('div');
    box.style.fontSize='14px'; box.style.lineHeight='1.6';

    if(focus==='situacion'){
      const p = document.createElement('p');
      p.style.margin='0 0 10px';
      p.innerHTML = '<mark style="background:#f6dfa8; padding:1px 3px;">'+E.situacion+'</mark>';
      box.appendChild(p);
      const cap = document.createElement('p');
      cap.style.margin='0'; cap.style.fontSize='13px'; cap.style.color='var(--ink-soft)';
      cap.innerHTML = '<b>Quién actúa:</b> '+E.actor+' &nbsp;·&nbsp; <b>Qué está en juego:</b> '+E.problema;
      box.appendChild(cap);
    }

    if(focus==='pregunta'){
      const p1 = document.createElement('p');
      p1.style.margin='0 0 8px'; p1.style.color='var(--ink-soft)';
      p1.textContent = E.situacion;
      box.appendChild(p1);
      const p2 = document.createElement('p');
      p2.style.margin='0 0 10px';
      p2.innerHTML = '<mark style="background:#f6dfa8; padding:1px 3px; font-weight:600;">'+E.pregunta+' …</mark>';
      box.appendChild(p2);
      const cap = document.createElement('p');
      cap.style.margin='0'; cap.style.fontSize='13px'; cap.style.color='var(--ink-soft)';
      cap.innerHTML = 'La pregunta es por el <b>propósito de la estrategia</b>, no por el tema (acueducto y alcantarillado) ni por cómo ejecutarla paso a paso.';
      box.appendChild(cap);
    }

    if(focus==='descarte'){
      ['A','B','C','D'].forEach(letra=>{
        const o = E.opciones[letra];
        const ok = o.veredicto==='correcta';
        const row = document.createElement('div');
        row.style.display='flex'; row.style.gap='10px'; row.style.marginBottom='10px'; row.style.alignItems='flex-start';
        const mark = document.createElement('span');
        mark.style.fontFamily="'JetBrains Mono',monospace"; mark.style.fontWeight='700'; mark.style.fontSize='13px';
        mark.style.color = ok ? 'var(--forest)' : 'var(--brick)';
        mark.textContent = ok ? '✓ '+letra : '✕ '+letra;
        row.appendChild(mark);
        const txtWrap = document.createElement('div');
        const t = document.createElement('div');
        t.style.fontSize='13.5px';
        t.style.textDecoration = ok ? 'none' : 'line-through';
        t.style.color = ok ? 'var(--ink)' : 'var(--ink-soft)';
        t.textContent = o.texto;
        txtWrap.appendChild(t);
        const r = document.createElement('div');
        r.style.fontSize='12.5px'; r.style.marginTop='2px'; r.style.color = ok?'var(--forest)':'var(--brick)';
        r.textContent = o.razon;
        txtWrap.appendChild(r);
        row.appendChild(txtWrap);
        box.appendChild(row);
      });
    }

    if(focus==='verbos'){
      const grid = document.createElement('div');
      grid.style.display='grid'; grid.style.gridTemplateColumns='repeat(auto-fit,minmax(150px,1fr))'; grid.style.gap='10px'; grid.style.marginBottom='10px';
      ['A','B','C','D'].forEach(letra=>{
        const o = E.opciones[letra];
        const ok = o.veredicto==='correcta';
        const c = document.createElement('div');
        c.style.border='1.5px solid '+(ok?'var(--forest)':'var(--line)');
        c.style.borderRadius='2px'; c.style.padding='10px';
        c.style.background = ok ? '#eef2df' : 'var(--white)';
        c.innerHTML = '<div style="font-family:JetBrains Mono,monospace; font-size:11px; color:var(--ink-soft);">OPCIÓN '+letra+'</div>' +
                       '<div style="font-family:Fraunces,serif; font-weight:600; font-size:15px; margin-top:3px; color:'+(ok?'var(--forest)':'var(--ink)')+';">'+o.verbo+'</div>';
        grid.appendChild(c);
      });
      box.appendChild(grid);
      const cap = document.createElement('p');
      cap.style.margin='0'; cap.style.fontSize='13px'; cap.style.color='var(--ink-soft)';
      cap.innerHTML = '<b style="color:var(--forest);">construyan</b> implica que el estudiante crea algo nuevo con base en un análisis — el mayor nivel de protagonismo entre los cuatro verbos.';
      box.appendChild(cap);
    }

    return box;
  }

  function buildModuloCard(m){
    const mod = MODULOS[m];
    const con = CONCEPTOS[m];
    const card = el('div','card');
    card.appendChild(el('span','field-label', mod.titulo.toUpperCase()+' · qué evalúa este módulo'));
    const resumen = document.createElement('p');
    resumen.style.fontSize='16px'; resumen.style.lineHeight='1.65'; resumen.style.margin='0 0 18px';
    resumen.textContent = con.resumen;
    card.appendChild(resumen);

    con.claves.forEach(k=>{
      const box = el('div');
      box.style.borderLeft='3px solid var(--gold)';
      box.style.padding='4px 0 4px 16px';
      box.style.marginBottom='20px';
      const tag = el('div','tag comp', COMPETENCIAS[m][k.comp]);
      tag.style.marginBottom='6px'; tag.style.display='inline-block';
      box.appendChild(tag);
      const p = document.createElement('p');
      p.style.margin='0 0 12px'; p.style.fontSize='14.5px'; p.style.lineHeight='1.55';
      p.textContent = k.d;
      box.appendChild(p);

      if(k.ejemplo){
        const ex = k.ejemplo;
        const key = m+'-'+k.comp;
        const abierto = !!state.ejemplosAbiertos[key];

        const toggle = document.createElement('button');
        toggle.type='button';
        toggle.style.background='none'; toggle.style.border='none'; toggle.style.cursor='pointer';
        toggle.style.padding='0'; toggle.style.font="inherit";
        toggle.style.color='var(--magenta-deep)'; toggle.style.fontSize='13px'; toggle.style.fontWeight='600';
        toggle.style.display='flex'; toggle.style.alignItems='center'; toggle.style.gap='6px';
        toggle.innerHTML = '<span style="font-family:JetBrains Mono,monospace; font-size:11px;">'+(abierto?'▾':'▸')+'</span> '+(abierto?'Ocultar ejemplo típico':'Ver ejemplo típico');
        toggle.onclick=()=>{ state.ejemplosAbiertos[key] = !abierto; render(); };
        box.appendChild(toggle);

        if(abierto){
          const exBox = document.createElement('div');
          exBox.style.background='var(--paper)';
          exBox.style.border='1px solid var(--line)';
          exBox.style.borderRadius='2px';
          exBox.style.padding='14px 16px';
          exBox.style.marginTop='10px';

          const exLabel = el('div','eyebrow','Ejemplo típico');
          exLabel.style.marginBottom='8px';
          exBox.appendChild(exLabel);

          const sit = document.createElement('p');
          sit.style.margin='0 0 8px'; sit.style.fontSize='14px'; sit.style.lineHeight='1.55';
          sit.textContent = ex.situacion;
          exBox.appendChild(sit);

          const preg = document.createElement('p');
          preg.style.margin='0 0 10px'; preg.style.fontSize='14px'; preg.style.fontWeight='600'; preg.style.fontStyle='italic';
          preg.textContent = ex.pregunta;
          exBox.appendChild(preg);

          const opsMini = document.createElement('div');
          opsMini.style.display='flex'; opsMini.style.flexDirection='column'; opsMini.style.gap='6px'; opsMini.style.marginBottom='10px';
          ['A','B','C','D'].forEach(letra=>{
            const isC = letra===ex.correcta;
            const row = document.createElement('div');
            row.style.display='flex'; row.style.gap='8px'; row.style.fontSize='13px'; row.style.lineHeight='1.45';
            row.style.color = isC ? 'var(--forest)' : 'var(--ink-soft)';
            row.style.fontWeight = isC ? '700' : '400';
            row.innerHTML = '<span>'+(isC?'✓':'·')+' '+letra+'.</span><span>'+ex.opciones[letra]+'</span>';
            opsMini.appendChild(row);
          });
          exBox.appendChild(opsMini);

          const why = document.createElement('p');
          why.style.margin='0'; why.style.fontSize='13.5px'; why.style.lineHeight='1.55'; why.style.color='var(--ink-soft)';
          why.innerHTML = '<b style="color:var(--ink); font-family:Fraunces,serif;">¿Por qué '+ex.correcta+'?</b> '+ex.porque;
          exBox.appendChild(why);

          box.appendChild(exBox);
        }
      }

      card.appendChild(box);
    });
    return card;
  }

  function viewConceptos(){
    const wrap = el('div');

    const tabbar = el('div','tabbar');
    const tabs = [
      ['guia','Cómo leer una pregunta situacional'],
      ['formar','Formar · qué evalúa este módulo'],
      ['evaluar','Evaluar · qué evalúa este módulo'],
      ['ensenar','Enseñar · qué evalúa este módulo']
    ];
    tabs.forEach(([key,label])=>{
      const btn = el('button','tab-btn'+(state.conceptoTab===key?' active':''), label);
      btn.onclick=()=>{ state.conceptoTab=key; render(); };
      tabbar.appendChild(btn);
    });
    wrap.appendChild(tabbar);

    if(state.conceptoTab==='guia'){
      const guia = el('div','card');
      guia.appendChild(el('span','field-label','Cómo leer una pregunta situacional'));
      guia.appendChild(renderGuiaSlider());
      wrap.appendChild(guia);
    } else {
      wrap.appendChild(buildModuloCard(state.conceptoTab));
    }

    const btnRow = el('div','btn-row');
    const practicar = el('button','btn magenta', state.conceptoTab==='guia' ? 'Practicar en modo estudio →' : 'Practicar este módulo en modo estudio →');
    practicar.onclick=()=>{
      state.modo='estudio';
      if(state.conceptoTab!=='guia') state.modulos=[state.conceptoTab];
      state.screen='setup';
      render();
    };
    btnRow.appendChild(practicar);
    const back = el('button','btn secondary','Volver');
    back.onclick=volverInicio;
    btnRow.appendChild(back);
    wrap.appendChild(btnRow);

    return wrap;
  }

  render();
})();
</script>
</body>
</html>
