<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulador Saber Pro/TyT · Normalistas Superiores</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%233B2A1E'/%3E%3Cpath d='M22 54 L44 74 L80 28' stroke='%23FBF1E1' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --ink:#3B2A1E;
    --ink-soft:#6d5a45;
    --paper:#FBF1E1;
    --paper-2:#F0DEC0;
    --line:#dcc4a0;
    --magenta:#B5492A;
    --magenta-deep:#8C3620;
    --gold:#BD8A2E;
    --forest:#5F7A3D;
    --brick:#8C2F26;
    --white:#FFFBF3;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(181,73,42,0.06), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--magenta-deep); font-weight:700;
  }
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:-0.01em;}
  .masthead{
    border-bottom:3px double var(--ink);
    padding-bottom:16px; margin-bottom:28px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;
  }
  .masthead h1{font-size:30px; color:var(--ink);}
  .masthead .sub{color:var(--ink-soft); font-size:14px; margin-top:4px; font-style:italic;}
  .badge-seal{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.05em;
    border:1.5px solid var(--magenta-deep); color:var(--magenta-deep);
    padding:5px 10px; border-radius:100px; white-space:nowrap;
    transform:rotate(-2deg);
  }

  /* ---- Setup screen ---- */
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    box-shadow:0 1px 0 rgba(0,0,0,0.04);
  }
  .card + .card{margin-top:18px;}
  .field-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:10px; display:block;
  }
  .choice-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px;}
  .choice{
    border:1.5px solid var(--line); background:var(--paper);
    border-radius:var(--radius); padding:14px 16px; cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
    font-family:'Source Serif 4',serif;
  }
  .choice:hover{border-color:var(--magenta);}
  .choice.selected{border-color:var(--magenta-deep); background:#f6e2d2; box-shadow:inset 0 0 0 1px var(--magenta-deep);}
  .choice h4{margin:0 0 4px; font-family:'Fraunces',serif; font-size:16px; font-weight:600;}
  .choice p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.4;}

  .btn{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;
    border:1.5px solid var(--ink); background:var(--ink); color:var(--white);
    padding:12px 22px; border-radius:var(--radius); cursor:pointer;
    transition:opacity .15s, transform .08s;
  }
  .btn:hover{opacity:.88;}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:transparent; color:var(--ink); border-color:var(--ink);}
  .btn.magenta{background:var(--magenta-deep); border-color:var(--magenta-deep);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn-row{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}

  /* ---- Quiz screen ---- */
  .quizbar{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:10px;
  }
  .progress-track{height:6px; background:var(--paper-2); border-radius:6px; overflow:hidden; margin-bottom:22px;}
  .progress-fill{height:100%; background:var(--magenta-deep); transition:width .3s;}
  .timer{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
    padding:3px 10px; border:1px solid var(--line); border-radius:100px;
  }
  .timer.low{color:var(--brick); border-color:var(--brick);}

  .qmeta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .tag{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    padding:4px 9px; border-radius:100px; border:1px solid var(--line); color:var(--ink-soft);
  }
  .tag.comp{border-color:var(--gold); color:#7a5f1c;}
  .tag.dif-baja{border-color:var(--forest); color:var(--forest);}
  .tag.dif-media{border-color:var(--gold); color:#7a5f1c;}
  .tag.dif-alta{border-color:var(--brick); color:var(--brick);}

  .enunciado{font-size:17px; line-height:1.65; margin-bottom:22px;}
  .opciones{display:flex; flex-direction:column; gap:10px;}
  .op{
    display:flex; gap:14px; align-items:flex-start;
    border:1.5px solid var(--line); border-radius:var(--radius); padding:14px 16px;
    cursor:pointer; background:var(--white); transition:border-color .15s, background .15s;
  }
  .op:hover{border-color:var(--magenta);}
  .op .letra{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
    width:26px; height:26px; min-width:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--ink); color:var(--ink);
  }
  .op p{margin:0; line-height:1.5; font-size:15px; padding-top:2px;}
  .op.selected{border-color:var(--ink); background:var(--paper);}
  .op.selected .letra{background:var(--ink); color:var(--white);}

  .op.correct{border-color:var(--forest); background:#eef2df;}
  .op.correct .letra{background:var(--forest); color:var(--white); border-color:var(--forest);}
  .op.wrong{border-color:var(--brick); background:#f5ded7;}
  .op.wrong .letra{background:var(--brick); color:var(--white); border-color:var(--brick);}
  .op.disabled{cursor:default;}

  .feedback{margin-top:18px; border-radius:var(--radius); overflow:hidden;}
  .feedback-head{
    padding:12px 16px; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
    font-weight:700; display:flex; align-items:center; gap:10px;
  }
  .feedback-head.ok{background:var(--forest); color:var(--white);}
  .feedback-head.no{background:var(--brick); color:var(--white);}
  .feedback-body{border:1.5px solid var(--line); border-top:none; padding:16px; background:var(--white); font-size:14.5px; line-height:1.6;}
  .feedback-body .why{margin-bottom:10px;}
  .feedback-body .why b{font-family:'Fraunces',serif;}
  .feedback-body .invalid-item{margin-bottom:8px; color:var(--ink-soft);}
  .feedback-body .invalid-item b{color:var(--ink);}
  .no-explic{color:var(--ink-soft); font-style:italic; font-size:13.5px;}

  .stamp{
    display:inline-block; transform:rotate(-6deg);
    border:2.5px solid var(--forest); color:var(--forest);
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; letter-spacing:.08em;
    padding:4px 10px; border-radius:4px; margin-left:auto;
  }
  .stamp.no{border-color:var(--brick); color:var(--brick); transform:rotate(4deg);}

  /* ---- Results ---- */
  .score-hero{
    text-align:center; padding:32px 20px 26px; border-bottom:3px double var(--ink); margin-bottom:24px;
  }
  .score-num{font-family:'Fraunces',serif; font-size:64px; font-weight:700; color:var(--magenta-deep); line-height:1;}
  .score-label{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-top:6px;}

  .comp-row{display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid var(--paper-2);}
  .comp-row .name{flex:0 0 250px; font-size:13.5px; line-height:1.35;}
  .comp-bar-track{flex:1; height:10px; background:var(--paper-2); border-radius:6px; overflow:hidden;}
  .comp-bar-fill{height:100%; border-radius:6px;}
  .comp-row .frac{font-family:'JetBrains Mono',monospace; font-size:12px; width:52px; text-align:right; color:var(--ink-soft);}

  .failed-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .failed-pill{
    font-family:'JetBrains Mono',monospace; font-size:12px; border:1px solid var(--brick); color:var(--brick);
    padding:4px 10px; border-radius:100px;
  }

  .tabbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
  .tab-btn{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
    padding:10px 16px; border-radius:100px; border:1.5px solid var(--line); background:var(--white); color:var(--ink-soft);
    cursor:pointer; transition:border-color .15s, background .15s, color .15s;
  }
  .tab-btn:hover{border-color:var(--magenta);}
  .tab-btn.active{background:var(--ink); border-color:var(--ink); color:var(--white);}

  .hint{font-size:13px; color:var(--ink-soft); margin-top:6px;}
  .center{text-align:center;}
  a.textlink{color:var(--magenta-deep); cursor:pointer; text-decoration:underline;}
  ::selection{background:var(--magenta); color:white;}
  @media (max-width:600px){
    .comp-row{flex-wrap:wrap;}
    .comp-row .name{flex:1 1 100%;}
    .score-num{font-size:48px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
const COMPETENCIAS = {
  formar: {
    fis: "Comprende las características físicas, intelectuales y sociales de sus estudiantes",
    cul: "Entiende la importancia del desarrollo cultural de sus estudiantes",
    vin: "Vincula sus prácticas educativas con la institución como centro de desarrollo social y cultural",
    pro: "Comprende sus propios procesos de desarrollo profesional y busca mejoramiento continuo"
  },
  evaluar: {
    alt: "Conoce diversas alternativas para evaluar",
    imp: "Comprende el impacto de la evaluación en el mejoramiento de los procesos educativos",
    aut: "Comprende la relevancia de la autorregulación en los sujetos de la educación"
  },
  ensenar: {
    dis: "Diseña proyectos curriculares, planes de estudio y unidades de aprendizaje",
    act: "Promueve actividades de enseñanza-aprendizaje (desarrollo conceptual, actitudinal, procedimental)",
    did: "Comprende el uso de la didáctica de las disciplinas en la enseñanza"
  }
};

const MODULOS = {
  formar: {
    titulo: "Formar",
    subtitulo: "Interacción entre el profesor, sus estudiantes y la comunidad",
    preguntas: [
      {n:1, comp:"fis", dif:null, correcta:"D",
        enun:"La salida pedagógica de los estudiantes del grado octavo fue suspendida por las directivas de la institución educativa porque en los últimos tres años siempre se han presentado problemas como el consumo de bebidas alcohólicas, cigarrillo o salidas del lugar sin permiso del profesor encargado. Los estudiantes consideran injusta la medida, porque ellos no hicieron parte de los problemas y, en consecuencia, deciden entrar a clases solamente cuando se autorice la salida. Un profesor decide mediar entre los estudiantes y las directivas, y aprovecha la situación para lograr interacciones formativas. Por esto, considera que la situación más favorable para ello es",
        ops:{A:"convocar a los padres de familia para que se comprometan con el buen comportamiento de sus hijos y soliciten a las directivas autorizar la salida.",
             B:"invitar a una reunión a los estudiantes de noveno, décimo y undécimo grado para que respondan por sus actos y soliciten a las directivas autorizar la salida.",
             C:"reunir a los estudiantes de octavo grado y pedirles que cada uno escriba su compromiso de buen comportamiento para enviarlos a las directivas.",
             D:"realizar debates abiertos entre los integrantes de la comunidad educativa, a fin de concertar otras formas comunicativas abiertas a la multiplicidad."}},
      {n:2, comp:"cul", dif:null, correcta:"A",
        enun:"Un profesor implementa en sus clases actividades de reflexión sobre situaciones cotidianas con sus estudiantes, reconociendo que este tipo de actividades favorecen significativamente su formación ciudadana y social. Luego de observar los efectos de estas actividades, el profesor decide incluir en sus clases escenarios de participación a fin de propiciar un espacio en el cual sus estudiantes puedan reflexionar a partir de sus aprendizajes. De acuerdo con lo anterior, el propósito de incluir escenarios de participación es",
        ops:{A:"favorecer la adquisición de destrezas propositivas en sus estudiantes.",
             B:"contrastar su práctica educativa con las actividades que él ha propuesto.",
             C:"mejorar su relación con los estudiantes y con la comunidad educativa.",
             D:"examinar la imagen que los estudiantes tienen del saber que aprenden."}},
      {n:3, comp:"cul", dif:null, correcta:"C",
        enun:"Los profesores de un Centro Educativo rural, que trabaja con enfoque de Escuela Nueva, son conscientes de la importancia de una buena nutrición para mejorar los procesos de aprendizaje de sus estudiantes, y han visto con preocupación que un alto porcentaje de ellos presenta problemas de rendimiento escolar asociados a una alimentación deficiente. De acuerdo con el planteamiento anterior, la acción más acertada de la institución educativa para actuar con prontitud y buscar soluciones integrales es",
        ops:{A:"vincular al sector de la salud para la valoración del estado nutricional de los estudiantes.",
             B:"informar a los padres de familia sobre la situación, para que modifiquen sus hábitos alimentarios.",
             C:"realizar un proyecto comunitario sobre hábitos alimentarios y comunicar a las autoridades municipales.",
             D:"remitir los casos agudos de desnutrición al ICBF y hacer el seguimiento correspondiente."}},
      {n:4, comp:"cul", dif:null, correcta:"D",
        enun:"El entorno de una institución educativa se ha llenado de afiches, pendones, pasacalles y vallas con todo tipo de información; ante esta contaminación visual, los profesores de los grados 10.º y 11.º ven en esta situación una oportunidad para integrar los problemas de contaminación y su prevención a las prácticas ambientales previstas en el Proyecto Educativo Institucional (PEI) y en las políticas de educación ambiental. Para ello, deciden",
        ops:{A:"realizar con los estudiantes un recuento, ubicación y categorización de los afiches, pendones, pasacalles y vallas de la localidad.",
             B:"propiciar espacios de reflexión con todos los profesores de Ciencias Naturales y Sociales para incorporar el tema de la contaminación visual.",
             C:"realizar actividades ecológicas escolares para eliminar el uso de afiches, pendones, pasacalles y vallas en la institución y sus alrededores.",
             D:"propiciar el desarrollo de proyectos de educación ambiental con la comunidad, con miras a la resolución conjunta de esta problemática."}},
      {n:5, comp:"fis", dif:null, correcta:"B",
        enun:"Un grupo de estudiantes pide apoyo a un profesor acerca de una campaña que quisieran adelantar en el colegio, en pro de las familias damnificadas por el invierno (participantes: estudiantes, profesores, padres y funcionarios; tipos de ayudas: alimentos, ropa, calzado, utensilios). Luego de conocer la propuesta, el profesor se interesa en la campaña y decide acompañar a los estudiantes en su ejecución. En la situación anterior, se puede afirmar que la intención del profesor al participar es",
        ops:{A:"fomentar la participación de la familia en las actividades del colegio.",
             B:"promover en sus estudiantes el desarrollo de una actitud solidaria.",
             C:"crear en la comunidad una imagen prestigiosa de la institución.",
             D:"despertar la confianza y el respeto de sus estudiantes hacia él."}},
      {n:6, comp:"cul", dif:null, correcta:"D",
        enun:"Con el propósito de mejorar las condiciones ambientales de una institución educativa, el coordinador de Sociales les propone a los profesores de su área desarrollar un proyecto en el que participen los estudiantes de los diferentes grados y se comuniquen utilizando internet. Durante el desarrollo de este proyecto, se espera que los estudiantes",
        ops:{A:"incrementen su comunicación a través de internet, sin la intermediación de los profesores en el aula.",
             B:"utilicen libremente la información que circula a través de internet.",
             C:"aprovechen internet para la adquisición de información sobre los temas ambientales.",
             D:"intercambien ideas a través de internet en equipo para alcanzar metas conjuntas."}},
      {n:7, comp:"cul", dif:"baja", correcta:"C",
        enun:"Al comenzar el año escolar, los profesores de noveno grado de una institución educativa deciden implementar una estrategia para estimular en los estudiantes la elaboración de alternativas de solución para problemas comunitarios; para ello, eligen uno relacionado con el sistema de acueducto y alcantarillado de su localidad. Con esta estrategia se busca que los estudiantes",
        ops:{A:"indaguen con los expertos en el tema sobre las mejores alternativas de solución para este problema.",
             B:"consulten textos en la biblioteca para identificar posibles causas del problema.",
             C:"construyan opciones viables a partir del análisis de las causas del problema.",
             D:"divulguen entre la comunidad las soluciones que se han usado para resolver problemas similares."},
        expl:{correcta:"La respuesta C conlleva a los estudiantes a la elaboración de alternativas de solución para problemas comunitarios. Para ello, es necesario la construcción de opciones viables en relación con el problema examinando sus causas.",
              invalidas:{A:"No es correcta, porque quienes plantean las alternativas para la solución del problema son los expertos y no los estudiantes.",
                         B:"No plantea alternativas de solución. Por el contrario, propone identificar posibles causas al problema a partir de textos. No contempla que las causas sean identificadas por los estudiantes al observar y analizar las problemáticas asociadas al sistema de acueducto y alcantarillado de su localidad.",
                         D:"La divulgación de las soluciones a la comunidad es un resultado que se debe dar luego de abordar el problema, estudiarlo y encontrar algunas alternativas de solución."}}},
      {n:8, comp:"vin", dif:null, correcta:"A",
        enun:"En un Proyecto Educativo Institucional, se tiene como meta, para los programas relacionados con la gestión a la comunidad, contribuir con la formación de actores sociales con capacidad de comprensión y transformación de su contexto. Consecuente con ello, el criterio más relevante y formativo que deben cumplir las propuestas que realice la institución para enfrentar los desafíos de la comunidad es",
        ops:{A:"promover la autogestión de proyectos.",
             B:"desarrollar la capacidad de trabajo en equipo.",
             C:"facilitar la participación de la comunidad.",
             D:"difundir los programas institucionales."}},
      {n:9, comp:"vin", dif:null, correcta:"D",
        enun:"Los directivos docentes y los profesores de una institución educativa deciden revisar la estructura de su sistema de autoevaluación institucional, apoyados en la coherencia, la congruencia y la pertinencia. En este proceso, la revisión de los proyectos curriculares de área muestra fortalezas específicamente en la pertinencia. La pertinencia de los proyectos curriculares se evidencia cuando en la definición de sus objetivos y en sus ámbitos temáticos y problemáticos reconocen:",
        ops:{A:"Los contenidos contextualizados y una formación para el desarrollo de competencias.",
             B:"Las necesidades de los estudiantes y el consenso sobre la propuesta educativa de las áreas.",
             C:"La normatividad educativa y las teorías y métodos de las disciplinas objeto de enseñanza.",
             D:"La lectura crítica del entorno sociocultural y los principios misionales de la institución."}},
      {n:10, comp:"vin", dif:"media", correcta:"B",
        enun:"La Constitución Política de 1991 y la Ley General de Educación (115 de 1994) otorgan a los padres de familia el título de miembros de la comunidad educativa y los convoca a participar en diversas instancias de la gestión escolar. Desde esta perspectiva, el compromiso de los padres de familia con la formación escolar de sus hijos implica",
        ops:{A:"aportar los recursos económicos necesarios y enseñar las normas de comportamiento en el hogar.",
             B:"intercambiar orientaciones sobre los procesos formativos y participar en el mejoramiento institucional.",
             C:"asistir a los eventos programados por la institución y velar por la prestación del servicio educativo.",
             D:"recibir información sobre el comportamiento y rendimiento académico para tomar medidas a tiempo."},
        expl:{correcta:"La respuesta B establece el papel activo de los padres de familia en los procesos formativos. De acuerdo con las políticas educativas, es necesario intercambiar con cada uno de los estamentos de la comunidad educativa (incluyendo a los padres de familia) orientaciones sobre la gestión escolar. Parte de esta gestión es abordar el plan de mejoramiento institucional.",
              invalidas:{A:"Los padres de familia no tienen solamente la responsabilidad de aportar los recursos económicos y formar desde el hogar, sino que también deben participar en procesos de formación acordados institucionalmente.",
                         C:"Además de asistir a los eventos programados o recibir un informe convivencial o académico, los padres deben ser actores y partícipes de las decisiones que se toman a nivel institucional en las diferentes áreas de gestión que orienta el PEI.",
                         D:"Igual que C: no basta con recibir información periódica; se requiere participación activa en las decisiones institucionales."}}},
      {n:11, comp:"vin", dif:"alta", correcta:"A",
        enun:"Después de la autoevaluación institucional, los miembros de una comunidad educativa deciden redefinir el vínculo entre escuela y familia y modificar las prácticas de interacción, de manera que respondan a un enfoque menos operativo y más holístico. Para el nuevo enfoque se requiere:",
        ops:{A:"el compromiso recíproco de la escuela y la familia, para tomar decisiones conjuntas a favor del desarrollo de los estudiantes.",
             B:"el intercambio de información entre la escuela y la familia, para lograr la intervención de los padres en el rendimiento académico de sus hijos.",
             C:"el complemento entre la escuela y la familia, para que la escuela responda por los conocimientos y la familia por los principios.",
             D:"el encuentro entre la escuela y la familia, para cumplir la normatividad vigente y los compromisos adquiridos al firmar la matrícula."},
        expl:{correcta:"La respuesta A muestra el vínculo entre la escuela y la familia como parte fundamental del PEI. Un enfoque holístico implica un compromiso recíproco escuela/familia para la toma de decisiones en pro de la formación y el desarrollo integral de los estudiantes.",
              invalidas:{B:"Al tener en cuenta un enfoque holístico, no basta con un intercambio de información entre la escuela y la familia; eso pertenece a los procesos de comunicación interna y externa a nivel institucional.",
                         C:"No es correcto afirmar que el complemento se centra en que la familia aporta los principios y la escuela los conocimientos. Ambos aspectos implican una corresponsabilidad.",
                         D:"Los padres de familia tienen una función más allá de cumplir con la normatividad y los compromisos de matrícula; desde un enfoque holístico, familia y escuela se encuentran en un compromiso conjunto."}}},
      {n:12, comp:"fis", dif:null, correcta:"C",
        enun:"Las directivas y los profesores de una institución educativa están empeñados en la búsqueda de alternativas pedagógico-didácticas que pongan el acento y el protagonismo en sus estudiantes, a fin de que asuman posturas más reflexivas y críticas sobre las condiciones sociales que agobian el entorno institucional, caracterizado por escasez de recursos, desempleo, desplazamiento e intolerancia por disimilitud de prácticas culturales. En este sentido, las propuestas educativas deben apuntar a trabajar fuertemente a favor de:",
        ops:{A:"El fortalecimiento de la identidad institucional y el compromiso con el proyecto de vida personal.",
             B:"El compromiso con el manual de convivencia y el respeto a los puntos de vista propios y ajenos.",
             C:"Las prácticas que favorezcan la inclusión, la valoración de la diversidad y el manejo de conflictos.",
             D:"Las actividades que promuevan la responsabilidad, la aceptación de las dificultades y la confianza."}},
      {n:13, comp:"fis", dif:null, correcta:"B",
        enun:"En Colombia, el fortalecimiento de actitudes positivas que favorezcan en los estudiantes la coherencia entre sus concepciones y sus prácticas democráticas es un propósito educativo que se logra con el desarrollo de competencias ciudadanas. La actividad que resulta más conveniente para promover actitudes democráticas en los estudiantes es",
        ops:{A:"consultar el significado de actitudes democráticas.",
             B:"participar en el desarrollo de un proyecto de aula.",
             C:"conocer los principios del Proyecto Educativo Institucional.",
             D:"recibir lecciones sobre competencias ciudadanas."}},
      {n:14, comp:"fis", dif:null, correcta:"A",
        enun:"A su ingreso en el aula, un profesor encuentra que dos estudiantes están agrediéndose física y verbalmente. Luego de detener el altercado, el profesor les pide regresar a sus lugares y da inicio a las actividades programadas. Para superar estas agresiones, el profesor y el equipo de profesores pueden diseñar y aplicar estrategias pedagógicas en las cuales se desarrollen:",
        ops:{A:"Actividades que estimulen la convivencia y el respeto por la diferencia entre estudiantes.",
             B:"Clases que contribuyan a mantener buenos niveles de disciplina y atención entre los estudiantes.",
             C:"Acciones adecuadas sobre el conocimiento y cumplimiento de los estudiantes del manual de convivencia.",
             D:"Reuniones con las familias de los estudiantes para informarles sobre las sanciones a los estudiantes."}},
      {n:15, comp:"pro", dif:null, correcta:"C",
        enun:"\"Los estudiantes de una institución se caracterizan por su excelencia académica, por respetar diferentes perspectivas y modos de pensar, ser críticos y buscar situaciones creativas a problemas complejos\" (PEI, colegio Y). Algunos profesores quieren desarrollar una investigación para evidenciar las características de los estudiantes que se mencionan en el PEI. La mejor metodología para llevar a cabo la investigación es",
        ops:{A:"comparar los resultados de los estudiantes en Saber 11, con los resultados de los estudiantes de la institución y los resultados de estudiantes de instituciones cercanas.",
             B:"realizar una prueba de pensamiento crítico y creativo a los estudiantes de undécimo grado y mirar qué cantidad de estudiantes están por encima del promedio.",
             C:"comparar los resultados de los estudiantes tanto en la prueba de Saber 11, como en la prueba de pensamiento crítico y creativo y buscar correlaciones.",
             D:"realizar una prueba de pensamiento crítico y creativo a estudiantes de noveno y undécimo grados y comparar los dos grados entre sí."}},
      {n:16, comp:"pro", dif:null, correcta:"D",
        enun:"\"...a un profesor reflexivo no solo lo constituye la probidad intelectual de utilizar procesos cognoscitivos de análisis interno de los fenómenos curriculares y educativos, sino también la realización de actividades afectivas y morales en las aulas, en la comunidad escolar y en las asociaciones sociopolíticas\" (Villar, 1999, p. 22). De acuerdo con lo anterior, actuar reflexivamente favorece el desarrollo profesional de los profesores, ya que permite",
        ops:{A:"poder involucrarse en las expectativas de los estudiantes.",
             B:"intervenir para sistematizar hábitos en los estudiantes.",
             C:"estandarizar las habilidades de pensamiento de los estudiantes.",
             D:"comprender las realidades escolares de los estudiantes."}},
      {n:17, comp:"vin", dif:null, correcta:"D",
        enun:"El currículo tradicional o fragmentado se organiza según el supuesto de que las materias disciplinares pueden enseñarse de manera desconectada de las necesidades e intereses de los estudiantes. Por su parte, el currículo integral se organiza desde una perspectiva experiencial de la educación. Desde esta perspectiva, el trabajo por proyectos permite organizar el currículo teniendo como referente",
        ops:{A:"los conceptos disciplinarios fundamentales.",
             B:"las habilidades prerrequisito de conceptos previos.",
             C:"la estructura distintiva de las disciplinas.",
             D:"las prácticas confrontadoras y contextualizadas."}},
      {n:18, comp:"vin", dif:null, correcta:"C",
        enun:"En una reunión de directivas para identificar oportunidades de mejoramiento, la coordinadora de convivencia manifestó su preocupación ante la exclusión de los niños indígenas de los juegos por algunos grupos de muchachos y la discriminación de género en los espacios de recreación. El rector considera que esta problemática debe abordarse de manera colectiva con los padres de familia y la comunidad en general, porque la formación ciudadana trasciende el aula. Esto contribuye a",
        ops:{A:"prevenir los conflictos entre estudiantes y profesores.",
             B:"promover la justicia social y proteger los Derechos Humanos.",
             C:"crear contextos y prácticas de inclusión y respeto mutuo.",
             D:"transformar la convivencia fuera de la institución educativa."}},
      {n:19, comp:"fis", dif:null, correcta:"B",
        enun:"Frente a una situación de conflicto percibida en una institución educativa y que afecta la convivencia de los estudiantes, el papel de los profesores debe ser",
        ops:{A:"organizar equipos colaborativos que busquen disminuir las consecuencias que a futuro pueda tener el problema.",
             B:"identificar los orígenes del problema a fin de sugerir acciones alternativas que permitan superar la situación.",
             C:"solicitar la intervención de un profesional en psicología para que, con base en soportes teóricos, él proponga soluciones viables al problema.",
             D:"indagar por las percepciones que las directivas tienen acerca del problema para posteriormente tomar decisiones."}},
      {n:20, comp:"cul", dif:null, correcta:"A",
        enun:"De acuerdo con la Ley General de Educación, el Proyecto Educativo Institucional (PEI) es el resultado de una construcción colectiva y dinámica que expresa el compromiso de la institución con la formación integral de los estudiantes. El concepto de formación integral abarca la preparación de los estudiantes para el ejercicio de la ciudadanía como miembros activos de una comunidad; en ese sentido, se busca fortalecer en los estudiantes",
        ops:{A:"la autonomía y participación democrática en diversos contextos.",
             B:"la solidaridad y apropiación de los valores tradicionales del país.",
             C:"la identidad y aprendizaje de los símbolos patrios de la nación.",
             D:"la disciplina y adquisición de conocimientos cívicos relevantes."}},
      {n:21, comp:"cul", dif:null, correcta:"D",
        enun:"Los profesores de una institución educativa consideran el desarrollo del compromiso ambiental un componente importante en la formación integral de los estudiantes. Por tanto, proponen llevar a cabo un proyecto transversal que les permita comprender a los estudiantes la relación de interdependencia del ser humano con el medio. El proceso más adecuado para lograr este propósito es",
        ops:{A:"la búsqueda y el acceso a información sobre el impacto de los productos científicos y tecnológicos en el entorno natural.",
             B:"el estudio de los derechos constitucionales colectivos y del ambiente para exigir su respeto ante las autoridades competentes.",
             C:"el diseño de actividades que incluyan la enseñanza y el aprendizaje de los valores y actitudes de respeto por el ambiente natural.",
             D:"la participación en la identificación de problemas ambientales de su entorno y en el diseño de propuestas de solución viables."}},
      {n:22, comp:"pro", dif:null, correcta:"C",
        enun:"En una institución educativa, profesores de diferentes áreas conforman un grupo de estudio que tiene como objetivo consolidar una línea de investigación sobre prácticas educativas basada en la reciprocidad y el intercambio de propuestas disciplinares. De acuerdo con el objetivo del grupo, el propósito más pertinente es",
        ops:{A:"integrar el conocimiento cotidiano con el contexto institucional.",
             B:"relacionar la teoría educativa con las estrategias metodológicas.",
             C:"realizar proyectos interdisciplinares basados en el diálogo de saberes.",
             D:"fortalecer las relaciones entre los profesores con trabajos colectivos."}},
      {n:23, comp:"vin", dif:null, correcta:"C",
        enun:"Una institución educativa, que se preocupa por involucrar a padres de familia y acudientes en el proceso de formación de sus estudiantes, solicita al equipo de profesores implementar acciones a favor de este propósito en sus prácticas educativas. La mejor actividad que puede contribuir con este fin es",
        ops:{A:"realizar una encuesta abierta que permita identificar los estudiantes que viven con sus padres y aquellos que viven con su(s) acudiente(s).",
             B:"convocar a una reunión de padres y acudientes para conocer los hábitos de estudio de los estudiantes en sus hogares.",
             C:"invitar a padres y acudientes para que participen con los estudiantes en experiencias que se relacionen con los temas de las clases.",
             D:"consultar con padres y acudientes sus opiniones acerca de endurecer las normas que orientan la convivencia entre estudiantes."}}
    ]
  },

  evaluar: {
    titulo: "Evaluar",
    subtitulo: "Naturaleza, propósito e impacto de la evaluación educativa",
    preguntas: [
      {n:1, comp:"alt", dif:null, correcta:"D",
        enun:"En la evaluación de impacto de un Proyecto Educativo Institucional (PEI), se tienen en cuenta los resultados de los aprendizajes de los estudiantes en relación con la organización curricular, entre otros factores. Con base en lo anterior, los resultados de las pruebas Saber se convierten en una herramienta para",
        ops:{A:"conocer la interrelación de los estudiantes con el profesor y el interés por el área que enseña.",
             B:"determinar las prácticas de enseñanza y las formas que usa el profesor para recoger información.",
             C:"determinar el dominio que el profesor tiene del saber que enseña y la incidencia de las metodologías.",
             D:"hacer seguimiento a la práctica educativa e introducir acciones de mejora en los procesos formativos."}},
      {n:2, comp:"alt", dif:null, correcta:"D",
        enun:"Según Rafael Flórez (1999), un currículo es mucho más que un plan de estudios porque implica \"una concepción acerca de los contenidos, las experiencias, la actuación y la secuencia para que los alumnos alcancen las metas de formación\" (p. 82). Desde esta perspectiva, el currículo se evalúa con",
        ops:{A:"modelos exclusivamente cuantitativos que dan cuenta de los logros de los estudiantes.",
             B:"secuencias de contenidos de las materias y su apropiación por parte de los estudiantes.",
             C:"participaciones de los estudiantes a través de sus opiniones y expectativas de aprendizaje.",
             D:"modelos cualitativos que valoran el conjunto de procesos y transacciones que ocurren en su desarrollo."}},
      {n:3, comp:"imp", dif:null, correcta:"D",
        enun:"La evaluación es una acción eminentemente social que implica situar las actividades en un contexto amplio que además incluye lo económico y lo político. Con base en el contexto planteado, se puede afirmar sobre la evaluación que",
        ops:{A:"corresponde a los profesores diseñar pruebas acordes con las características del currículo y definir sus logros.",
             B:"requiere de pruebas nacionales para así dar cuenta de su amplitud y establecer modelos comparativos.",
             C:"trasciende el momento de aplicación de exámenes en el aula y la valoración de los trabajos de los estudiantes.",
             D:"articula las dimensiones pedagógica, metodológica y ética para definir los procesos y modelos por utilizar."}},
      {n:4, comp:"alt", dif:null, correcta:"D",
        enun:"El propósito más relevante, cuando un profesor realiza evaluaciones continuas que expresan su carácter formativo y ofrecen condiciones para la participación de los estudiantes en la definición de variables e indicadores es",
        ops:{A:"determinar los conocimientos y las habilidades del estudiante en diferentes saberes.",
             B:"hacer visible la capacidad del estudiante para aplicar los conocimientos en las prácticas.",
             C:"registrar los procesos de cambio del estudiante y comunicarle los resultados obtenidos.",
             D:"favorecer la autorregulación del estudiante sobre su aprendizaje, desempeño y resultados."}},
      {n:5, comp:"imp", dif:null, correcta:"C",
        enun:"La evaluación es un proceso de naturaleza social y ética encaminado a la mejora de la educación en general y, en particular, de sus procesos, actores y agentes. No obstante, desde comienzos del siglo XXI, en Colombia ha ido adquiriendo cada vez más peso político en la medida en que en muchos casos se ha sobredimensionado la medición de los resultados como indicador principal de la calidad de la educación. Desde esta perspectiva, se puede afirmar que la autoevaluación en las instituciones educativas tiene como propósito fundamental",
        ops:{A:"certificar la calidad de la gestión administrativa.",
             B:"mejorar la capacidad de aprendizaje de los estudiantes.",
             C:"fortalecer las capacidades de mejoramiento continuo.",
             D:"identificar las debilidades y carencias."}},
      {n:6, comp:"imp", dif:"baja", correcta:"D",
        enun:"Cuando se afirma que la evaluación es de naturaleza social, se está haciendo referencia a que es",
        ops:{A:"un acto individual propio de la autonomía del profesor.",
             B:"una plataforma de debate entre evaluados y evaluadores.",
             C:"una práctica que conduce a la competitividad.",
             D:"una práctica participativa de toda la institución educativa."},
        expl:{correcta:"Señala la naturaleza social de la evaluación. Lo anterior implica una práctica participativa para cada estamento dentro de la comunidad educativa.",
              invalidas:{A:"No es válida porque la evaluación entendida desde su naturaleza social no puede ser un acto individual, donde el profesor apela a su autonomía únicamente.",
                         B:"No es válida porque, aunque la evaluación implica el debate y la argumentación entre evaluadores y evaluados, al entenderse desde su naturaleza social se consideran otras prácticas evaluativas en el contexto escolar.",
                         C:"No es válida porque la evaluación no se centra en la competitividad. Más allá de esto, busca desarrollar procesos de autorregulación en los estudiantes y, desde una perspectiva social, favorece el trabajo colaborativo."}}},
      {n:7, comp:"imp", dif:null, correcta:"B",
        enun:"Los resultados de las pruebas Saber en el área de Matemáticas muestran niveles bajos en un municipio. Los directivos de las instituciones educativas y las autoridades municipales, preocupados con estos resultados, se reúnen para poner en marcha una acción que eleve los resultados en la siguiente convocatoria. Las acciones más indicadas para obtener mejores resultados son:",
        ops:{A:"Implementar proyectos de capacitación para los profesores en el diseño, aplicación y validación de pruebas.",
             B:"Generar condiciones de posibilidad para el trabajo en colectivo de los profesores, a fin de revisar el proyecto del área y acordar su implementación.",
             C:"Entrenar a los estudiantes para controlar los tiempos y conocer las indicaciones de respuesta de una prueba por competencias.",
             D:"Comprometer a los padres de familia en el acompañamiento académico y en el control de la asistencia a los cursos contratados."}},
      {n:8, comp:"aut", dif:null, correcta:"D",
        enun:"Para evidenciar que la motivación hacia la participación fortalece la autorregulación de los estudiantes, en la organización de la celebración de una actividad institucional, un profesor deberá",
        ops:{A:"preguntar quién quiere participar en la actividad.",
             B:"escoger a los estudiantes de mejor rendimiento.",
             C:"proponer el cronograma general de la actividad.",
             D:"escuchar las expectativas de los estudiantes."}},
      {n:9, comp:"aut", dif:null, correcta:"B",
        enun:"En la educación, el logro de la autonomía de los estudiantes es un objetivo que les permite darse normas propias y llegar a ser socialmente responsables. Una institución educativa interesada en la formación en valores y actitudes autónomas hacia los deberes de los estudiantes decide implementar un modelo para el desarrollo de la autonomía. En la ejecución de este modelo, un profesor que quiera desarrollar la autonomía en sus estudiantes y mejorar sus aprendizajes deberá:",
        ops:{A:"Diagnosticar ideas previas, diseñar un plan de trabajo, contextualizar los contenidos de la disciplina que enseña e identificar a los estudiantes que obtienen mejores resultados en sus exámenes.",
             B:"Conformar y liderar una mesa redonda que cuente con la participación de todos los estudiantes, a fin de construir en colectivo los criterios con los cuales ellos serán evaluados.",
             C:"Conocer la opinión de los estudiantes acerca del ambiente de la clase, diseñar un plan de actividades, motivar a los estudiantes y asignar tareas extras a quienes no han aprobado.",
             D:"Dialogar con los padres de familia para conocer las acciones que siguen para verificar que sus hijos realizan las tareas asignadas y para recomendarles estrategias que pueden implementar."}},
      {n:10, comp:"aut", dif:null, correcta:"A",
        enun:"Una actividad que un profesor puede implementar en sus clases para desarrollar la autonomía de los estudiantes es",
        ops:{A:"discusión de alternativas propuestas acerca de cómo evaluar el tema de la clase.",
             B:"generación de comentarios a la transcripción de un documental que se ha trasmitido en televisión.",
             C:"elección de monitores de clase para que evalúen las tareas de los demás estudiantes.",
             D:"elaboración de encuestas acerca de la opinión de los estudiantes sobre la evaluación."}},
      {n:11, comp:"imp", dif:"media", correcta:"C",
        enun:"Un profesor de Lengua Castellana decide cambiar el modelo de evaluación sumativa por un modelo de evaluación formativa, debido a que este le permite tomar en cuenta la diversidad de modos y ritmos de aprendizaje de sus estudiantes y mejorar los procesos de enseñanza y aprendizaje en su área. Al optar por un modelo de evaluación formativa, el profesor diseña pruebas que le permitan",
        ops:{A:"obtener resultados confiables para aplicar las pruebas a todos los estudiantes de un grado.",
             B:"realizar un examen objetivo al finalizar el año lectivo para certificar quiénes necesitan refuerzo.",
             C:"valorar los progresos de sus estudiantes en comparación con su propio proceso de aprendizaje.",
             D:"comparar los resultados de sus estudiantes para corroborar el nivel de logro de los objetivos."},
        expl:{correcta:"Valorar el proceso de aprendizaje de los estudiantes, así como su progreso alcanzado, es parte fundamental de la evaluación formativa. La evaluación es un proceso particular para cada estudiante.",
              invalidas:{A:"No es válida porque la evaluación formativa no busca estandarizar la forma de evaluar, tampoco pretende la consecución de resultados confiables.",
                         B:"No es válida porque la evaluación formativa se da a lo largo del proceso de enseñanza y aprendizaje, no únicamente al final del año.",
                         D:"No es válida porque la evaluación formativa busca el progreso en los aprendizajes de todos los estudiantes de manera continua, y no se centra en la comparación de los resultados."}}},
      {n:12, comp:"aut", dif:null, correcta:"D",
        enun:"Un profesor quiere fortalecer los valores ciudadanos de sus estudiantes y decide seguir el foro como técnica de trabajo. Esta técnica la implementa porque está interesado en fomentar en sus estudiantes la",
        ops:{A:"autoestima.", B:"autonomía.", C:"regulación.", D:"participación."}},
      {n:13, comp:"imp", dif:null, correcta:"B",
        enun:"Teniendo en cuenta que los límites entre las disciplinas cada vez son más tenues, las competencias transversales están adquiriendo mayor presencia y valor en los procesos de formación integral. El modelo holístico o relacional lo seleccionan cada vez más los profesores para el trabajo por competencias. Desde esta perspectiva, la propuesta de evaluación más coherente con este enfoque es",
        ops:{A:"la evaluación sumativa, porque da cuenta de los resultados.",
             B:"la coevaluación, porque permite la evaluación recíproca.",
             C:"la evaluación de expertos, porque elimina la subjetividad.",
             D:"la evaluación censal, porque permite establecer comparaciones."}},
      {n:14, comp:"aut", dif:null, correcta:"C",
        enun:"Una de las utilidades que tienen los resultados de las evaluaciones institucionales, que adelantan periódicamente las instituciones educativas, es la reformulación de planes estratégicos para",
        ops:{A:"el crecimiento en el número de estudiantes inscritos.",
             B:"el mejoramiento del ambiente laboral de los profesores.",
             C:"el mejoramiento de la calidad de los servicios educativos.",
             D:"la disminución de llamados de atención a estudiantes."}},
      {n:15, comp:"alt", dif:"alta", correcta:"C",
        enun:"Un grupo de estudiantes de décimo grado le expresa al coordinador de grupo su inconformidad con uno de sus profesores, que si bien reconocen como juicioso, responsable y estudioso, indican que su forma de enseñar es demasiado aburrida (llama a lista, escribe la fecha, explica un tema del libro, organiza talleres y asigna ejercicios para la casa). El tipo de evaluación que realiza el profesor corresponde con una perspectiva tradicional. De las estrategias mencionadas a continuación, la que le permite al profesor implementar formas alternativas es:",
        ops:{A:"Organizadores gráficos, salidas al tablero y heurística.",
             B:"Talleres, exámenes diarios y dictados.",
             C:"Portafolios, diarios pedagógicos y trabajo en pequeños grupos.",
             D:"Cuestionarios, calificación del cuaderno y mapas de ideas."},
        expl:{correcta:"Evidencia pertinencia en cuanto a que el profesor debe conocer e implementar formas de evaluación alternativas que busquen superar la metodología tradicional. El portafolio permite llevar las evidencias de logros y desempeños, los diarios pedagógicos permiten registrar los aprendizajes de los estudiantes y el trabajo en pequeños grupos favorece el trabajo colaborativo y el intercambio de saberes.",
              invalidas:{A:"Involucra algún tipo de evaluación tradicional (salidas al tablero), por lo que no se puede considerar en su conjunto como práctica evaluativa alternativa.",
                         B:"Talleres, exámenes diarios y dictados son evaluación tradicional.",
                         D:"Cuestionarios, calificación del cuaderno y mapas de ideas también involucran evaluación tradicional."}}},
      {n:16, comp:"imp", dif:null, correcta:"A",
        enun:"Los profesores de una institución educativa acuerdan presentar al Consejo Directivo una propuesta que favorezca la formación ciudadana. Los contenidos de la propuesta para favorecer la formación ciudadana son:",
        ops:{A:"Intervenir los conflictos, revisar las prácticas de evaluación de los aprendizajes y construir proyectos que relacionen los contenidos con los contextos.",
             B:"Involucrar a los padres de familia, construir un sistema de seguimiento a los indicadores de logro y revisar el proyecto pedagógico institucional.",
             C:"Invitar expertos en resolución de conflictos, consolidar un sistema de información e incrementar las horas del proyecto para la justicia y la paz.",
             D:"Conformar una junta para la evaluación de desempeño docente, realizar un reinado de valores y auspiciar diálogos entre las directivas y los estudiantes."}},
      {n:17, comp:"alt", dif:null, correcta:"A",
        enun:"Las instituciones educativas tienen el reto de convertirse en focos culturales de sus entornos sociales para dar cuenta del desarrollo de la gestión a la comunidad. La acción que engloba el reto mencionado para evaluar esta gestión es",
        ops:{A:"considerar la relación escuela/sociedad.",
             B:"identificar la relación egresados/emprendimiento.",
             C:"evidenciar la relación padres de familia/contexto.",
             D:"confirmar la relación sectores productivos/convenios."}},
      {n:18, comp:"aut", dif:null, correcta:"C",
        enun:"Una profesora identifica que, en su clase, los estudiantes manifiestan una alta predisposición por el trabajo individual. Para revertir esta situación, la profesora implementa prácticas evaluativas variadas. La mejor alternativa de práctica evaluativa que permite evidenciar el grado de interacción entre los estudiantes es",
        ops:{A:"el test de concepciones alternativas.",
             B:"la exposición de la historia de un concepto.",
             C:"el debate sobre una polémica científica.",
             D:"la elaboración de antecedentes de un tema."}},
      {n:19, comp:"imp", dif:null, correcta:"A",
        enun:"El sistema educativo colombiano está descentralizado y, por tanto, sus instituciones educativas son autónomas. La participación de las comunidades en el gobierno escolar ha generado nuevos modos de gestión educativa, en los cuales la evaluación desempeña un papel fundamental para",
        ops:{A:"orientar la toma de decisiones.",
             B:"establecer prioridades políticas.",
             C:"controlar el ritmo del cambio.",
             D:"incentivar a los profesores."}},
      {n:20, comp:"alt", dif:null, correcta:"C",
        enun:"Las comisiones de evaluación y promoción en las instituciones educativas hacen seguimiento a los resultados obtenidos por los estudiantes en las evaluaciones de cada periodo académico y sugieren estrategias pedagógicas para apoyar a quienes presentan debilidades. Esta práctica sistemática tiene razón de ser, si se toma en cuenta que uno de los propósitos de la evaluación institucional de los estudiantes es",
        ops:{A:"identificar modelos pedagógicos.",
             B:"medir la apropiación de competencias.",
             C:"analizar la información para tomar decisiones.",
             D:"determinar el porcentaje de reprobación."}},
      {n:21, comp:"imp", dif:null, correcta:"D",
        enun:"En repetidas ocasiones, se percibe que la relación entre profesores y padres de familia es escasa y que además los encuentros se entienden como una sucesión de quejas acerca de los estudiantes. La evaluación, con una perspectiva contemporánea, implica tener en cuenta todas las dimensiones del estudiante para implementar una evaluación formativa. Así, para establecer ese vínculo el profesor puede",
        ops:{A:"convocar a reuniones grupales cuando se requiera la intervención y el acompañamiento del núcleo familiar en el actuar de los estudiantes.",
             B:"anotar en la agenda de los estudiantes sus logros, fortalezas y debilidades cognitivas y hacer recomendaciones para mejorar.",
             C:"emitir citaciones individuales a padres de familia en la institución cuando se afecte la convivencia y bienestar de los estudiantes.",
             D:"diseñar un blog con acceso a estudiantes, profesor y padres de familia donde se publique el progreso cualitativo de los estudiantes."}},
      {n:22, comp:"imp", dif:null, correcta:"A",
        enun:"En el marco del sistema de evaluación que propone el Decreto 1290 de 2009, una institución educativa somete a análisis las características de la evaluación tradicional versus la evaluación auténtica. Un grupo de profesores decide implementar estrategias de evaluación auténticas con el fin de comprometer cada vez más a sus estudiantes con su proceso de aprendizaje. De acuerdo con lo anterior, la actividad de evaluación más pertinente es",
        ops:{A:"la toma de decisiones para resolver un problema de la comunidad que implique el uso de distintos conocimientos.",
             B:"la aplicación de un examen oral sobre una situación problemática propuesta por los temas del área.",
             C:"la construcción de un artefacto de utilidad según la temática desarrollada en las sesiones de clase.",
             D:"la puesta en escena de un problema del área que haga explícitos los conocimientos aprendidos."}},
      {n:23, comp:"aut", dif:null, correcta:"A",
        enun:"Un profesor desarrolla un proyecto llamado Comunicación asertiva. El objetivo consiste en generar habilidades de comunicación que permitan mediar y resolver conflictos en las relaciones interpersonales. Los indicadores de aprendizaje se definirán a través de una estrategia que reconoce la participación colectiva de los estudiantes. El procedimiento adecuado es el diálogo",
        ops:{A:"consensuado, el cual fomenta el acuerdo entre los intereses formativos establecidos por el profesor y los estudiantes como desarrolladores de la actividad.",
             B:"crítico, el cual permite llegar al fondo conceptual del tema a través del intercambio de ideas que se aproximan a la unificación de un criterio específico.",
             C:"reflexivo, el cual reconoce la opinión de los estudiantes al cuestionar el aprendizaje y permite analizar los aspectos relevantes del proceso académico.",
             D:"directo, el cual intercambia las ideas de forma presencial y posibilita la argumentación acerca de los contenidos de la temática expuesta."}},
      {n:24, comp:"aut", dif:null, correcta:"A",
        enun:"Las instituciones educativas enfrentan problemáticas relacionadas con el abandono escolar como resultado del bajo rendimiento académico de sus estudiantes. Dentro de las acciones por desarrollar deciden realizar una reforma curricular que incida en el proceso de enseñanza y aprendizaje, sustentada, entre otras, en la siguiente acción:",
        ops:{A:"Concebir el proceso evaluativo como el resultado de una acción investigativa.",
             B:"Elaborar un plan de acción que trace lineamientos curriculares y pedagógicos.",
             C:"Crear un banco de preguntas, que evalúen las diferentes áreas del conocimiento.",
             D:"Capacitar a los profesores sobre las nuevas estrategias y técnicas de evaluación."}}
    ]
  },

  ensenar: {
    titulo: "Enseñar",
    subtitulo: "Diseño, didáctica y desarrollo de la enseñanza en el aula",
    preguntas: [
      {n:1, comp:"dis", dif:null, correcta:"B",
        enun:"El profesor de Sociales se queja ante el coordinador académico porque dos de sus estudiantes nunca escuchan instrucciones y son los que más generan desorden. El coordinador conoce la trayectoria conflictiva de los estudiantes, así como su alto desempeño académico. Para atender esta situación, el coordinador académico le sugiere al profesor como estrategia",
        ops:{A:"buscar a los estudiantes en los recreos y volverse su amigo, porque la investigación educativa ha mostrado una correlación positiva entre la camaradería y la disciplina en el salón.",
             B:"observar los desempeños y comportamientos de los estudiantes para diseñar actividades de clase acordes con los objetivos y apropiadas para sus estilos de aprendizaje.",
             C:"citar a los padres semanalmente si es necesario, para que les recuerden a sus hijos las pautas sobre la disciplina y el comportamiento apropiados para la institución.",
             D:"prohibir a los estudiantes que se sienten cerca, porque el problema radica en que son una influencia negativa el uno para el otro."}},
      {n:2, comp:"act", dif:null, correcta:"A",
        enun:"Un profesor selecciona una actividad con el fin de favorecer la participación de los estudiantes en su clase. Para llevar a cabo este objetivo, la actividad seleccionada por el profesor debe ser",
        ops:{A:"interesante, para que el estudiante se reconozca como protagonista de su propio aprendizaje.",
             B:"creativa, para que los estudiantes atiendan la explicación del profesor durante el desarrollo de la clase.",
             C:"motivante, para incorporar todos los temas elegidos y para calificarlos según lo planificado.",
             D:"divertida, para que el estudiante considere que aprender es fácil y pueda aprobar los exámenes."}},
      {n:3, comp:"act", dif:null, correcta:"B",
        enun:"Las habilidades cognitivas forman parte de las habilidades de pensamiento que deben desarrollar los estudiantes en su proceso de aprendizaje. Un profesor encontró que, luego de incorporar los desarrollos cognitivos de sus estudiantes en las actividades de enseñanza, ellos disponían y usaban más estas habilidades, y mejoraban así el desempeño en su clase. Para ello, incorpora en la clase actividades relacionadas con",
        ops:{A:"contenidos procedimentales, para usar métodos de elaboración de saberes.",
             B:"situaciones de contexto, para favorecer la relación de un saber con otros saberes.",
             C:"contenidos actitudinales, para asimilar temas fundamentales de un saber.",
             D:"situaciones inusuales, para motivar a los estudiantes a aprender un saber."}},
      {n:4, comp:"dis", dif:null, correcta:"C",
        enun:"Según el propósito del currículo, la institución educativa considera que el papel del profesorado es relevante y, para ello, ha estimulado la integración de un equipo de profesores que orienten sus procedimientos y señalen unas pautas a seguir. El equipo conformado debe tener en cuenta los siguientes componentes:",
        ops:{A:"La evaluación de la organización curricular de contenidos procedimentales y los resultados de los estudiantes en pruebas censales.",
             B:"La fundamentación de los modelos pedagógicos y didácticos empleados y su aplicación en el desarrollo de competencias, habilidades y capacidades.",
             C:"La fundamentación de los modelos pedagógicos y didácticos empleados y su aplicación en el desarrollo de contenidos conceptuales, procedimentales y actitudinales.",
             D:"La evaluación de la organización curricular de contenidos conceptuales y los resultados de los estudiantes en pruebas censales."}},
      {n:5, comp:"act", dif:null, correcta:"C",
        enun:"En el segundo período del año escolar, un profesor percibe que un porcentaje alto de estudiantes presenta problemas de construcción conceptual en su área y baja participación en clase. Al indagar, encuentra que la mayor dificultad para comprender la materia se debe a la forma como están organizados los conceptos. Decide entonces cambiar su estrategia didáctica y relacionar más los contenidos curriculares con la vida cotidiana de los estudiantes. La implementación de esta nueva estrategia requiere un proceso educativo con énfasis en",
        ops:{A:"la definición de reglas claras para las intervenciones en clase y el control de la disciplina.",
             B:"la adopción de estímulos para quienes más participen y demuestren mayor interés en la clase.",
             C:"la flexibilización del plan de estudios y el estímulo a la disposición para interactuar con otros.",
             D:"la incorporación de lecturas sobre la participación y la comprobación de su comprensión."}},
      {n:6, comp:"act", dif:null, correcta:"B",
        enun:"En una institución educativa, los profesores de sexto grado consideran importante inculcar el sentido de la responsabilidad en los estudiantes y notan con preocupación que ellos no están cumpliendo con las tareas escolares asignadas. Al preguntarles su opinión, los estudiantes consideran que, para cumplir con las tareas, se deben suspender las actividades extracurriculares obligatorias de la jornada complementaria. Para reforzar el sentido de responsabilidad en los estudiantes, los profesores proponen",
        ops:{A:"exponer ante los padres de familia las ventajas de exigir a sus hijos el cumplimiento de las tareas escolares.",
             B:"considerar los compromisos que asumen los estudiantes en las dos jornadas para la asignación de tareas.",
             C:"premiar a los estudiantes que, además de participar en ambas jornadas, cumplen con las tareas académicas.",
             D:"privilegiar las tareas académicas que estimulen el intelecto, porque las demás actividades son recreativas."}},
      {n:7, comp:"did", dif:null, correcta:"B",
        enun:"El plan de estudios de una institución educativa se desarrolla con prácticas pedagógicas que promuevan interdisciplinariedad, que relacionen contenidos de diferentes áreas, con el fin de que los profesores, en sus clases, hagan explícitas las condiciones socio-históricas de la producción de las disciplinas. Para favorecer la interdisciplinariedad, un profesor procura que sus estudiantes sean capaces de",
        ops:{A:"aprender los saberes propios de cada área escolar.",
             B:"articular problemas de distintos campos del saber.",
             C:"identificar los objetos de conocimiento de la ciencia.",
             D:"integrar temas trabajados en distintos grados escolares."}},
      {n:8, comp:"dis", dif:null, correcta:"B",
        enun:"Un estilo de aprendizaje puede definirse como un conjunto de estrategias de las que el estudiante hace uso para lograr aprender; estas estrategias varían en relación con lo que se quiere aprender, pero, aun así, cada estudiante presenta una tendencia por utilizar más unas que otras. Conocer los estilos de aprendizaje de los estudiantes forma parte de las competencias docentes, pues ello le permite al profesor",
        ops:{A:"prever que los estudiantes aprendan un número adecuado de contenidos de la clase de acuerdo con los objetivos propuestos.",
             B:"seleccionar actividades para desarrollar en las clases y estimular el aprendizaje de teorías, conceptos, predisposiciones y prácticas.",
             C:"brindar una mejor asesoría a los padres de familia acerca de cómo fomentar en sus hijos habilidades para la realización de tareas.",
             D:"dar solución a los bajos resultados académicos de los estudiantes demostrando que todos deben aprender y al mismo ritmo."}},
      {n:9, comp:"act", dif:null, correcta:"C",
        enun:"Un grupo de profesores retoma los resultados del proceso de autoevaluación institucional realizado hace cuatro años, referidos al desafío de repensar la relación sociedad/escuela y refundar la escuela para que aporte alternativas. Revisar este propósito permitió reconocer que no se ha avanzado significativamente. En cada área, los profesores se proponen promover en los estudiantes actitudes críticas, razonando deductivamente alrededor del ejercicio ciudadano. Para ello, en sus clases deben planear el desarrollo de habilidades cognitivas",
        ops:{A:"creativas.", B:"verbales.", C:"analíticas.", D:"organizativas."}},
      {n:10, comp:"act", dif:null, correcta:"B",
        enun:"La planeación de una unidad temática que integre actividades de diversas áreas como las ciencias sociales, las artes, el lenguaje y las matemáticas requiere un proceso previo de reflexión. La pregunta inicial que usted como profesor se formula para llevar a cabo este proceso es:",
        ops:{A:"¿Cuánto tiempo debo dedicarle a cada área?",
             B:"¿Qué objetivos debo incluir en la unidad?",
             C:"¿Qué materiales voy a escoger para motivar a los estudiantes?",
             D:"¿Cómo voy a evaluar el desempeño de los estudiantes?"}},
      {n:11, comp:"dis", dif:null, correcta:"A",
        enun:"La descripción es una habilidad cognitivo-lingüística que se estimula con la mayoría de actividades que un estudiante desarrolla en su proceso de aprendizaje. Un profesor considera que esta habilidad se puede estimular haciendo uso del contexto cultural de los estudiantes y para ello realiza una caracterización de este. De acuerdo con lo anterior, se puede afirmar que el propósito del profesor es",
        ops:{A:"facilitar el vínculo entre los contenidos de aprendizaje de la disciplina que enseña con las características del entorno, a fin de desarrollar habilidades descriptivas en los estudiantes.",
             B:"identificar a los estudiantes que tienen más posibilidades de lograr buenos resultados académicos, para desarrollar en ellos habilidades descriptivas de las características del entorno.",
             C:"explicar, con base en las características del entorno, las razones por las cuales solo unos pocos estudiantes aprueban la asignatura, con el fin de modificar los instrumentos de evaluación.",
             D:"elaborar un plan de trabajo que mejore la infraestructura de la institución educativa, a fin de cambiar el entorno de los estudiantes y favorecer mejores resultados en el aprendizaje."}},
      {n:12, comp:"act", dif:"baja", correcta:"A",
        enun:"Un grupo de estudiantes de décimo grado le expresa al coordinador de grupo su inconformidad con uno de sus profesores, de quien, si bien reconocen como juicioso, responsable y estudioso, afirman que su modo de enseñar es demasiado aburrido (llama a lista, escribe la fecha, explica un tema del libro, organiza talleres y asigna ejercicios para la casa). El coordinador propone a su colega implementar otras estrategias de enseñanza que integren a los estudiantes en situaciones auténticas y desarrollen habilidades cognitivas. Una estrategia que se ajusta a esta intención es proponer:",
        ops:{A:"la identificación de problemáticas del contexto cercano de los estudiantes que involucren múltiples alternativas de explicación.",
             B:"una consulta de temas con base en una guía preestablecida por el profesor, en la cual los estudiantes responden a partir de un texto asignado.",
             C:"una serie de actividades espontáneas desarrolladas por los estudiantes con independencia de la planificación, con el propósito de centrar su atención.",
             D:"la asignación de exposiciones, consultas y dinámicas que motiven a los estudiantes a realizar actividades más participativas."},
        expl:{correcta:"La respuesta A comprende situaciones auténticas para la enseñanza, como las problemáticas del contexto cercano a los estudiantes. El hecho de que involucren múltiples alternativas de explicación implica el desarrollo de habilidades cognitivas en los estudiantes.",
              invalidas:{B:"Implica una estrategia de enseñanza tradicional que no plantea ningún tipo de situación auténtica.",
                         C:"Propone actividades independientes de la planificación; aunque pueden centrar la atención, no son pertinentes si se pretende que el profesor tenga en cuenta los desarrollos cognitivos de los estudiantes, lo cual exige planificación.",
                         D:"Plantea exposiciones, consultas y dinámicas que, aunque pueden motivar, no responden a la sugerencia de integrar situaciones auténticas para el desarrollo de habilidades cognitivas."}}},
      {n:13, comp:"act", dif:null, correcta:"C",
        enun:"La formación por competencias requiere conocimientos, procedimientos, actitudes y disposiciones que deben estar relacionados entre sí para propiciar un aprendizaje retador y con sentido. En el caso de las competencias transversales, estas pueden evaluarse con",
        ops:{A:"un examen de comprensión de conceptos.",
             B:"una exposición con el uso de las TIC.",
             C:"una simulación de un problema.",
             D:"una encuesta con preguntas cerradas."}},
      {n:14, comp:"act", dif:"media", correcta:"B",
        enun:"Según Bruner (1961), la mejor manera de generar interés en un tema es mostrarlo a los estudiantes como algo que vale la pena saber, y esto significa hacer que ese conocimiento sea útil en situaciones distintas a las que se han usado para aprenderlo. De acuerdo con lo anterior, las mejores actividades para enseñar un nuevo concepto, que promueva la motivación de los estudiantes, son:",
        ops:{A:"Una exposición del concepto y de su importancia por parte del profesor y una investigación escrita sobre posibles aplicaciones del nuevo concepto.",
             B:"Un ejercicio de aplicación seguido por la resolución de un problema de la vida real de elección libre que utiliza el nuevo concepto.",
             C:"Una investigación sobre la importancia del tema, construida a partir de una pregunta orientadora, y un mapa conceptual de las aplicaciones del nuevo concepto en la vida real.",
             D:"El diseño de un video sobre el nuevo concepto para mostrar su importancia y su publicación en el blog de la asignatura."},
        expl:{correcta:"La respuesta B es la más pertinente, puesto que, como lo plantea Bruner, implica que los estudiantes sean capaces de resolver problemas por sí mismos, lo cual corresponde al aprendizaje por descubrimiento.",
              invalidas:{A:"Incluye la importancia del tema y posibles aplicaciones, pero no implica la resolución de problemas por parte del estudiante.",
                         C:"Evidencia posibles aplicaciones, pero tampoco implica resolución de problemas por el estudiante mismo.",
                         D:"Genera interés en los estudiantes, pero no implica la resolución de problemas."}}},
      {n:15, comp:"act", dif:null, correcta:"D",
        enun:"En clase de Sociales, los estudiantes están aprendiendo sobre las formas de participación ciudadana en el país. La actividad más pertinente para que los estudiantes apropien estos conceptos es",
        ops:{A:"leer las diferentes formas de participación ciudadana que existen en el libro de texto, en internet, y en revistas.",
             B:"ver ejemplos de participación ciudadana en el siglo XX en diferentes países del mundo.",
             C:"estudiar la Constitución y aprender las diferentes maneras de participación ciudadana que existen.",
             D:"plantear un dilema en el cual los estudiantes proponen estrategias de participación ciudadana."}},
      {n:16, comp:"act", dif:null, correcta:"A",
        enun:"Un profesor está interesado en conocer y orientar las dudas de los estudiantes de uno de los temas de su clase. Decide realizar una actividad de dos horas y tres fases (\"¡Mis inquietudes!\"). En la primera fase, mediante marcadores (uno por estudiante) y cartulinas (tres por estudiante), el profesor busca que ellos expongan sus inquietudes. Las instrucciones que el profesor debe comunicarles para la realización adecuada de la actividad individual, en su fase uno, son:",
        ops:{A:"Revisar apuntes de clase, identificar aquellos puntos que aún no comprenden, reflexionar para formularlos en forma de pregunta, escribir una pregunta en cada cartulina y entregar al profesor.",
             B:"Identificar cuáles son los materiales de trabajo, verificar que estos estén completos (en caso de no estarlo, informar al profesor), escribir tres preguntas de interés, revisar la redacción y entregar al profesor.",
             C:"Escribir una pregunta en cada cartulina, comparar sus preguntas con las de otros estudiantes, modificar las preguntas que sean muy simples, reformular las preguntas y entregar al profesor.",
             D:"Emplear sus conocimientos para formular preguntas novedosas, escoger las tres preguntas más difíciles, escribir las tres preguntas en las cartulinas, revisar la redacción y entregar al profesor."}},
      {n:17, comp:"did", dif:null, correcta:"C",
        enun:"En el proceso de planeación del año escolar, un profesor de Sociales prepara una secuencia de enseñanza para grado noveno llamada \"Transformaciones sobre el territorio natural colombiano\", de manera que los estudiantes den cuenta de los esfuerzos de cada generación por dominar, explotar o disfrutar su territorio desde tiempos remotos hasta la actualidad, generando un documento audiovisual y escrito como producto de su indagación. Por tanto, la planeación de la unidad didáctica debe basarse en un enfoque",
        ops:{A:"tecnológico, marcado por el pensamiento creativo para estimular la curiosidad científica útil para resolver problemas y tomar decisiones sobre la realidad local.",
             B:"empírico-analítico, marcado por el pensamiento sensorial e inductivo para describir, explicar y predecir sucesos mediante deducciones no contradictorias.",
             C:"socio-cultural, marcado por el pensamiento reflexivo para comprender y estudiar los fenómenos de las interacciones del individuo en un momento histórico dado.",
             D:"subjetivo, marcado por el pensamiento introspectivo, del mundo interior, para almacenar, recuperar y utilizar la información recibida a través de los sentidos."}},
      {n:18, comp:"dis", dif:"alta", correcta:"D",
        enun:"La concepción del mundo wayuu se fundamenta en la espiritualidad y el pensamiento propio mediados por la oralidad, el ejemplo, la imitación, la observación directa, la convivencia y las experiencias vividas. En la nación wayuu, el saber es transmitido de manera oral y práctica mediada por la participación del individuo en la producción cultural. Según este contexto, los objetivos de formación en los primeros grados de un proyecto etnoeducativo desarrollado en una institución educativa de La Guajira deben orientarse a",
        ops:{A:"fomentar procesos de comunicación que les permitan a los estudiantes compartir y enriquecer los conocimientos de su comunidad con los de otras culturas.",
             B:"promover el intercambio de experiencias con otras culturas, donde se realice la asimilación de costumbres adaptándolas a su propia identidad.",
             C:"fortalecer los procesos de escritura, de manera que inicie sus procesos de adquisición de una segunda lengua que faciliten la interacción con otras culturas.",
             D:"favorecer, a partir de la palabra hablada y la interacción entre estudiantes, procesos de construcción de conocimiento que propendan al fortalecimiento de la identidad cultural."},
        expl:{correcta:"La respuesta D es la más adecuada, ya que considera el fortalecimiento de la identidad cultural, principio fundamental en todo proyecto etnoeducativo.",
              invalidas:{A:"Plantea el intercambio cultural, que hace parte de la interculturalidad, pero no es uno de los principios más relevantes del sistema educativo propio wayuu.",
                         B:"Aborda la asimilación de costumbres, lo que se aleja de los modelos educativos propios de las comunidades indígenas.",
                         C:"Implica aspectos relacionados con la etnoeducación, pero no pone el énfasis en los principios que orientan la educación wayuu."}}},
      {n:19, comp:"dis", dif:null, correcta:"D",
        enun:"El aprendizaje se promueve por medio de interacciones, reformulaciones y transformaciones continuas. Las ideas previas están presentes durante todo ese proceso; por ello, las actividades en clase deben permitir que los estudiantes revelen lo que ya saben o creen saber, no como mera información para el profesor sino para hacer uso provechoso de ello, buscando la forma de enriquecerla, completarla, cuestionarla, complejizarla y relacionarla con los nuevos conocimientos. Esta perspectiva de enseñanza y aprendizaje le permite al profesor",
        ops:{A:"la comprensión de los aciertos y errores de los estudiantes frente a un tema.",
             B:"el análisis de las contradicciones y confusiones que surjan durante el proceso.",
             C:"la orientación a los estudiantes en la adquisición de nuevos conocimientos.",
             D:"el reconocimiento de ideas y percepciones preliminares de los estudiantes."}},
      {n:20, comp:"did", dif:null, correcta:"A",
        enun:"En general, un conocimiento disciplinar está constituido por todas aquellas leyes, teorías y conceptos que el profesor usa como referencia para organizar los contenidos que se deben enseñar y para diseñar el currículo del curso. En la formación de los estudiantes, el conocimiento disciplinar le permite al profesor",
        ops:{A:"transformarlo para elaborar contenidos de aprendizaje.",
             B:"usarlo para poner en práctica políticas educativas.",
             C:"aprovecharlo para mejorar niveles de motivación en la clase.",
             D:"tomarlo como referencia para asignar actividades extra clase."}},
      {n:21, comp:"dis", dif:null, correcta:"B",
        enun:"La descripción es una habilidad cognitivo-lingüística que se estimula con la mayoría de actividades que un estudiante desarrolla en su proceso de aprendizaje. Un profesor espera que sus estudiantes mejoren la manera como describen fenómenos propios de su contexto social e implementa en sus clases estrategias innovadoras para potenciar esta habilidad al tiempo que aprenden. Las estrategias que el profesor implemente deberán considerar:",
        ops:{A:"El modelo económico del contexto de los estudiantes, el fomento de estilos cognitivistas de aprendizaje y el uso de modelos didácticos directivistas.",
             B:"Los contenidos de enseñanza, el fomento de estilos de aprendizaje por resolución de problemas y las particularidades del entorno de la institución educativa.",
             C:"El contexto de los estudiantes, el desarrollo de metodologías que garantizan buenas explicaciones del profesor y el uso de modelos didácticos constructivistas.",
